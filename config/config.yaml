# Fraud Detection Platform Configuration

app:
  name: FraudShield
  version: 1.0.0
  debug: true
  host: 0.0.0.0
  port: 8000

database:
  url: "sqlite:///./fraudshield.db"  # or postgresql://user:pass@localhost/fraudshield
  echo: false

ml:
  model_path: "./models"
  feature_columns:
    - amount
    - transaction_type
    - location_distance
    - time_of_day
    - device_fingerprint
    - previous_fraud_count
    - velocity_1h
    - velocity_24h
  target: is_fraud

kafka:
  bootstrap_servers: "localhost:9092"
  topic: "transactions"

redis:
  url: "redis://localhost:6379/0"

auth:
  secret_key: "your-secret-key-change-in-production"
  algorithm: "HS256"
  access_token_expire_minutes: 30